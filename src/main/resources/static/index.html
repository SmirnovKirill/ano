<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор</title>
<style>
  body { max-width: 420px; margin: 64px auto; padding: 0 20px; font: 18px system-ui; }
  form, label { display: grid; gap: 8px; }
  form { gap: 20px; }
  input, button { font: inherit; padding: 10px; }
  output { display: block; margin-top: 24px; overflow-wrap: anywhere; }
</style>
<h1>Калькулятор</h1>
<form id="calculator">
  <label>Первое число <input name="a" type="number" step="any" required></label>
  <label>Второе число <input name="b" type="number" step="any" required></label>
  <label>Дата <input name="date" type="date" required></label>
  <button>Посчитать</button>
</form>
<output id="result" aria-live="polite"></output>
<script>
  const form = document.querySelector('#calculator');
  const result = document.querySelector('#result');
  const button = form.querySelector('button');
  form.addEventListener('submit', async event => {
    event.preventDefault();
    button.disabled = true;
    result.textContent = 'Считаю…';
    try {
      const params = new URLSearchParams(new FormData(form));
      const response = await fetch(`/api/calculate?${params}`);
      if (!response.ok) throw new Error('Проверь числа и дату.');
      const data = await response.json();
      result.textContent = `Сумма: ${data.sum}; дата: ${data.date}`;
    } catch (error) {
      result.textContent = error.message;
    } finally {
      button.disabled = false;
    }
  });
</script>
</html>
